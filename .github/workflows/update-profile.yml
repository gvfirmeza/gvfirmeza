name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *" # every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/computer.png", ".github/workflows/update-profile.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build profile.svg
        run: python scripts/build.py
        env:
          # optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to count private commits
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg data/stats.json
          git diff --cached --quiet || (git commit -m "chore: update profile card" && git push)
